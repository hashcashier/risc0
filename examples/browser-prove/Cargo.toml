[package]
name = "browser-prove"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
cuda = ["risc0-zkvm/cuda"]

[dependencies]
bevy-core = { path = "../bevy/core" }
bevy-methods = { path = "../bevy/methods" }
bn254-core = { path = "../bn254/core" }
bn254-methods = { path = "../bn254/methods" }
bytes = "1.5"
bytemuck = "1.13"
chess-core = { path = "../chess/core" }
chess-methods = { path = "../chess/methods" }
composition-example-methods = { path = "../composition/methods" }
console_error_panic_hook = "0.1"
digital-signature-core = { path = "../digital-signature/core" }
digital-signature-methods = { path = "../digital-signature/methods" }
forust-ml = "0.4.8"
groth16-verifier-methods = { path = "../groth16-verifier/methods" }
hello-world-methods = { path = "../hello-world/methods" }
hex = "0.4"
image = { version = "0.24", default-features = false }
json-core = { path = "../json/core" }
json-methods = { path = "../json/methods" }
jwt-core = { path = "../jwt-validator/core" }
jwt-methods = { path = "../jwt-validator/methods" }
k256 = { version = "=0.13.3", features = ["arithmetic", "serde", "expose-field", "std", "ecdsa"], default-features = false }
k256-methods = { path = "../ecdsa/k256/methods" }
keccak-methods = { path = "../keccak/methods" }
num-bigint = { version = "0.4", default-features = false, features = ["serde"] }
p256 = { version = "=0.13.2", features = [
  "arithmetic",
  "serde",
  "expose-field",
  "std",
  "ecdsa",
], default-features = false }
p256-methods = { path = "../ecdsa/p256/methods" }
password-checker-core = { path = "../password-checker/core" }
password-checker-methods = { path = "../password-checker/methods" }
prorata-core = { path = "../prorata/core" }
prorata-methods = { path = "../prorata/methods" }
risc0-bigint2-methods = { path = "../../risc0/bigint2/methods" }
risc0-binfmt = { path = "../../risc0/binfmt" }
risc0-circuit-keccak = { path = "../../risc0/circuit/keccak", features = [
  "webgpu",
] }
risc0-circuit-recursion = { path = "../../risc0/circuit/recursion", features = [
  "test",
  "webgpu",
] }
risc0-groth16 = { path = "../../risc0/groth16" }
risc0-zkp = { path = "../../risc0/zkp", features = ["webgpu"] }
risc0-zkvm = { path = "../../risc0/zkvm", default-features = false, features = [
  "webgpu",
] }
risc0-zkvm-methods = { path = "../../risc0/zkvm/methods", features = ["std"] }
risc0-zkos-v1compat = { path = "../../risc0/zkos/v1compat" }
rmp-serde = "1.3"
rust_decimal = "1.36"
serde = "1.0"
serde_json = "1.0"
sha-methods = { path = "../sha/methods" }
smartcore = { git = "https://github.com/risc0/smartcore.git", rev = "4bd3cadd50ed988c45c239f5264c3e2c2af0a690", features = ["serde"] }
smartcore-ml-methods = { path = "../smartcore-ml/methods" }
voting-machine-core = { path = "../voting-machine/core" }
voting-machine-methods = { path = "../voting-machine/methods" }
waldo-core = { path = "../waldo/core", default-features = false }
waldo-methods = { path = "../waldo/methods" }
wasm-methods = { path = "../wasm/methods" }
wasm-bindgen-test = "0.3"
wat = "1.0"
wordle-core = { path = "../wordle/core" }
wordle-methods = { path = "../wordle/methods" }
xgboost-methods = { path = "../xgboost/methods" }

[build-dependencies]
rzup = { path = "../../rzup", default-features = false }
